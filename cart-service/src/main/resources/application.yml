server:
  port: 8094

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:postgresql://localhost:5436/cartdb
    username: admin
    password: admin123
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
