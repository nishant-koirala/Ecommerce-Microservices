server:
  port: 8092

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5434/productdb
    username: admin
    password: admin123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload-dir: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info
