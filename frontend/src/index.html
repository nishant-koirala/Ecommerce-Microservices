<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atelier — Modern Essentials, Curated</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atelier — a curated modern essentials store. Thoughtfully designed goods, delivered to your door.">
  <meta name="theme-color" content="#1c1917">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
